  if (edit){
    document.getElementById("cancelEdit").onclick=()=>{
      state.editingExpenseId=null;
      toast("已取消編輯");
      renderAdd();
    };
  }

  const amountInput = document.getElementById("f_amount");
  const amountPreview = document.getElementById("amountPreview");
  function refreshAmountPreview(){
    const v = evalAmountExpression(amountInput.value);
    amountPreview.textContent = Number.isFinite(v) ? `= ${money(v)}` : ``;
  }
  amountInput.addEventListener("input", refreshAmountPreview);
  refreshAmountPreview();

  const isOrderEl = document.getElementById("f_isOrder");
  const isBillEl  = document.getElementById("f_isBill");
  const orderBlock = document.getElementById("orderBlock");
  const billBlock  = document.getElementById("billBlock");
  function refreshBlocks(){
    orderBlock.style.display = isOrderEl.checked ? "block" : "none";
    billBlock.style.display  = isBillEl.checked ? "block" : "none";
  }
  isOrderEl.addEventListener("change", refreshBlocks);
  isBillEl.addEventListener("change", refreshBlocks);
  refreshBlocks();
  
  // ★ Auto-Fill Logic (Updated as requested)
  // Fill Full Amount from Top Amount
  document.getElementById("fillFullAmt").onclick = () => {
      const v = evalAmountExpression(document.getElementById("f_amount").value);
      if(Number.isFinite(v)) {
          document.getElementById("f_orderFullAmt").value = v;
          toast("已填入全款");
      }
  };
  // Fill Paid Amount from Top Amount
  document.getElementById("fillPaidAmt").onclick = () => {
      const v = evalAmountExpression(document.getElementById("f_amount").value);
      if(Number.isFinite(v)) {
          document.getElementById("f_orderPaidAmt").value = v;
          toast("已填入已付金額");
      }
  };

  document.getElementById("f_receipt").addEventListener("change", async (e)=>{
    const f=e.target.files?.[0];
    if(!f) return;
    const url=await readFileAsDataURL(f);
    document.getElementById("receiptPreviewWrap").style.display="block";
    const img=document.getElementById("receiptPreview");
    img.src=url; img.dataset.value=url;
    toast("已上傳");
    e.target.value="";
  });

  const clearBtn=document.getElementById("clearReceipt");
  if (clearBtn){
    clearBtn.onclick=()=>{
      document.getElementById("receiptPreviewWrap").style.display="none";
      const img=document.getElementById("receiptPreview");
      img.src=""; img.dataset.value="";
    };
  }

  document.getElementById("resetForm").onclick=()=>{
    state.editingExpenseId=null;
    toast("已重設");
    renderAdd();
  };

  document.getElementById("saveExpense").onclick=()=>{
    const date = document.getElementById("f_date").value;
    const amount = evalAmountExpression(document.getElementById("f_amount").value);
    const title = document.getElementById("f_title").value.trim();
    const categoryId = document.getElementById("f_cat").value;
    const platform = document.getElementById("f_platform").value;
    const payment = document.getElementById("f_payment").value;
    const note = document.getElementById("f_note").value.trim();
    const receiptImage = (document.getElementById("receiptPreview")?.dataset.value) || (edit?.receiptImage||"");

    const isOrder = document.getElementById("f_isOrder").checked;
    const isBill  = document.getElementById("f_isBill").checked;
    const orderDue = isOrder ? document.getElementById("f_orderDue").value : "";
    const orderDelivery = isOrder ? (document.getElementById("f_orderDelivery").value || "面交") : "面交";
    const orderFullAmt = isOrder ? evalAmountExpression(document.getElementById("f_orderFullAmt").value) : 0;
    const orderPaidAmt = isOrder ? evalAmountExpression(document.getElementById("f_orderPaidAmt").value) : 0;

    const billDue  = isBill  ? document.getElementById("f_billDue").value : "";

    if (!date){ toast("請選日期"); return; }
    if (!Number.isFinite(amount) || amount<=0){ toast("金額不正確"); return; }
    if (!categoryId){ toast("請選類別"); return; }

    recomputeOctopusBalance();
    if (payment==="八達通" && (edit?.type!=="octopus_topup")){
      const bal=octo().balance;
      if (bal - amount < -0.01){
        Modal.confirm({
          title:"八達通餘額不足", msg:`現時餘額 ${money(bal)}。仍然要保存嗎？`,
          okText:"保存", cancelText:"取消", onOk:()=> doSave(),
        });
        return;
      }
    }
    if (isOrder && !orderDue){ toast("請填到期日"); return; }
    if (isBill && !billDue){ toast("請填扣款日"); return; }

    doSave();

    function doSave(){
      const exp = {
        id: edit?.id || uid("exp"), date, amount: Math.round(amount*100)/100,
        title: title || "(無標題)", categoryId, platform, payment,
        note, receiptImage, createdAt: edit?.createdAt || Date.now(), type: edit?.type || ""
      };
      const idx=data.expenses.findIndex(x=>x.id===exp.id);
      if (idx>=0) data.expenses.splice(idx,1,exp);
      else data.expenses.push(exp);

      if (isOrder){
        if (!data.orders) data.orders = [];
        // 如果是編輯模式，檢查是否已存在該 ID 的訂單，否則新增
        let ord = null;
        if(edit) {
             // 嘗試尋找關聯訂單 (簡易版：假設新增時同步新增，這裡其實無法完美追蹤 ID，除非 expense 存了 orderId)
             // 為了簡單起見，這裡新增訂單視為 "新的訂單需求"。
             // 若要嚴謹，應該在 expense 存 orderId。
             // 這裡採用: 總是新增一個新的 Order 紀錄 (假設用戶勾選了 isOrder 就是要加一筆)
        }
        data.orders.push({
          id: uid("ord"), name: exp.title, amount: exp.amount, 
          fullAmt: Number.isFinite(orderFullAmt) ? orderFullAmt : 0,
          paidAmt: Number.isFinite(orderPaidAmt) ? orderPaidAmt : 0,
          dueDate: orderDue, createdDate: exp.date, categoryId: exp.categoryId,
          platform: exp.platform, delivery: orderDelivery, note: "", status: "active"
        });
      }

      if (isBill){
        const dueDay = Number(billDue.slice(8,10)) || 1;
        const startMonth = monthKey(exp.date);
        const bill = {
          id: uid("bill"), name: exp.title, amount: exp.amount, startMonth,
          dueDay: Math.max(1, Math.min(31, dueDay)), categoryId: exp.categoryId || "cat_sub",
          remindBeforeDays: 3, active: true, lastPaidMonthByMonth: {}
        };
        data.fixedBills.push(bill);
      }

      state.selectedDay = exp.date;
      state.reportMonth = monthKey(exp.date);
      state.editingExpenseId=null;
      toast("已保存");
      setTab("calendar");
    }
  };
}

/* =========================
   Orders page
   ========================= */
function renderOrders(){
  setTitle("訂購物");
  if (!data.orders) data.orders = [];
  
  // Sort: Active first (sorted by date), then Done.
  const list = [...data.orders].sort((a,b)=> {
      if (a.status !== b.status) {
          return a.status === "active" ? -1 : 1;
      }
      return (a.dueDate||"").localeCompare(b.dueDate||"");
  });

  main.innerHTML = `
    <div class="card">
      <div class="row">
        <div class="left"><div class="h">訂購清單</div></div>
        <button class="btn primary small" id="goAddOrder">新增</button>
      </div>
      <div class="list" id="orderList"></div>
    </div>
  `;

  document.getElementById("goAddOrder").onclick=()=> { state.editingExpenseId=null; setTab("add"); };

  const orderList=document.getElementById("orderList");
  if (!list.length){
    orderList.innerHTML = `<div class="hint">暫時未有訂購物。</div>`;
    return;
  }

  orderList.innerHTML = list.map(o=>{
    const cat=catById(o.categoryId);
    const diff = o.dueDate ? daysDiffFromToday(o.dueDate) : null;
    const soon = diff!==null && diff<=3 && diff>=0 && o.status==="active";
    const late = diff!==null && diff<0 && o.status==="active";
    const badge = (o.status==="active")
      ? (late ? `<span class="bad">過期</span>` : (soon?`<span class="warn">快到</span>`:`<span class="ok">進行中</span>`))
      : `<span class="tag">已完成</span>`;
    
    const full = Number(o.fullAmt || 0);
    const paid = Number(o.paidAmt || 0);
    const remain = full - paid;
    
    let paymentStatusHtml = "";
    if (full > 0 || paid > 0) {
        let remainStr = "";
        if (remain <= 0) {
            remainStr = `<span class="ok">已結清~</span>`;
        } else {
            remainStr = `<span class="bad">剩下需補款: ${money(remain)}</span>`;
        }
        paymentStatusHtml = `
            <div class="meta" style="margin-top:4px; color:var(--text-main);">
               全款: ${money(full)} · 已結: ${money(paid)}
            </div>
            <div class="meta">${remainStr}</div>
        `;
    }

    return `
      <div class="item ${o.status==='done'?'done':''}" style="${soon||late ? 'border-color:#fde68a;background:#fffbeb':''}">
        <div class="row" style="align-items:flex-start">
          <div class="left" style="flex:1;">
            <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
              <div style="font-size:18px">${cat?.icon||"🧾"}</div>
              <div class="title">${escapeHtml(o.name||"(訂購物)")}</div>
            </div>
            
            <div class="meta">購買日：${o.createdDate || "未知"}</div>
            <div class="meta">預計：${o.dueDate||"—"} · ${badge}</div>
            
            ${paymentStatusHtml}
            
            <div class="meta">取貨：${escapeHtml(o.delivery||"面交")}</div>
          </div>
          
          <div style="text-align:right">
            <div class="amt">${money(o.amount)}</div>
          </div>
        </div>
        <div class="actions">
          ${(o.status==="active" && remain > 0) ? `<button class="btn small primary" data-settle="${o.id}">已補尾款</button>` : ``}
          <button class="btn small" data-toggleorder="${o.id}">${o.status==="active"?"完成/取消":"重開"}</button>
          <button class="btn small" data-editorder="${o.id}">編輯</button>
          <button class="btn small danger" data-delorder="${o.id}">刪除</button>
        </div>
      </div>
    `;
  }).join("");

  orderList.querySelectorAll("[data-settle]").forEach(btn=>{
      btn.onclick = () => {
          const id = btn.dataset.settle;
          const o = data.orders.find(x => x.id === id);
          if(!o) return;
          const remain = Number(o.fullAmt) - Number(o.paidAmt);
          
          Modal.confirm({
              title: "補尾款",
              msg: `將新增一筆支出 ${money(remain)}，並將訂單更新為已付全款。\n(訂單仍保持進行中)`,
              okText: "確定",
              onOk: () => {
                  // Add Expense
                  const iso=todayISO();
                  const exp={
                    id: uid("exp"), date: iso, amount: Math.round(remain*100)/100,
                    title: `尾款: ${o.name}`, categoryId: o.categoryId, platform: o.platform, payment: "現金",
                    note: "自動產生之尾款", receiptImage: "", createdAt: Date.now(), type: ""
                  };
                  data.expenses.push(exp);
                  
                  // Update Order
                  o.paidAmt = o.fullAmt;
                  // 注意：這裡不更改 o.status，保持 "active"
                  
                  toast("已新增尾款支出");
                  renderOrders();
              }
          });
      };
  });

  orderList.querySelectorAll("[data-toggleorder]").forEach(btn=>{
    btn.onclick=()=>{
      const id=btn.dataset.toggleorder;
      const o=data.orders.find(x=>x.id===id);
      if(!o) return;
      o.status = (o.status==="active") ? "done" : "active";
      toast("已更新狀態");
      renderOrders();
    };
  });
  orderList.querySelectorAll("[data-delorder]").forEach(btn=>{
    btn.onclick=()=>{
      const id=btn.dataset.delorder;
      Modal.confirm({
        title:"刪除", msg:"確定刪除？", okText:"刪除", cancelText:"取消",
        onOk:()=>{
          data.orders = data.orders.filter(x=>x.id!==id);
          toast("已刪除");
          renderOrders();
        }
      });
    };
  });
  orderList.querySelectorAll("[data-editorder]").forEach(btn=>{
    btn.onclick=()=>{
      const id=btn.dataset.editorder;
      const o=data.orders.find(x=>x.id===id);
      if(!o) return;
      Modal.form({
        title:"編輯訂購物",
        fields:[
          { type:"text", key:"name", label:"名稱" },
          { type:"text", key:"amount", label:"記帳金額 (本筆支出)" },
          { type:"divider" },
          { type:"text", key:"fullAmt", label:"全款" },
          { type:"text", key:"paidAmt", label:"已結" },
          { type:"divider" },
          { type:"date", key:"due", label:"到期日" },
          { type:"select", key:"delivery", label:"交收", options:[{value:"面交",text:"面交"},{value:"快遞",text:"快遞"}] },
          { type:"switch", key:"active", label:"進行中" },
        ],
        values:{
          name:o.name||"", 
          amount:String(o.amount??""), 
          fullAmt: String(o.fullAmt||""),
          paidAmt: String(o.paidAmt||""),
          due:o.dueDate||"",
          delivery:o.delivery||"面交", active:o.status==="active"
        },
        submitText:"保存",
        onSubmit:(v, done)=>{
          const amount=evalAmountExpression(v.amount);
          const full=evalAmountExpression(v.fullAmt);
          const paid=evalAmountExpression(v.paidAmt);
          
          if(!Number.isFinite(amount)){ toast("金額錯"); return; }
          
          o.name=v.name; 
          o.amount=amount; 
          o.fullAmt = Number.isFinite(full) ? full : 0;
          o.paidAmt = Number.isFinite(paid) ? paid : 0;
          o.dueDate=v.due; o.delivery=v.delivery;
          o.status=v.active?"active":"done";
          toast("已保存");
          done(); renderOrders();
        }
      });
    };
  });
}

/* =========================
   Settings
   ========================= */
function renderSettings(){
  setTitle("設定");
  const cats=data.categories;

  main.innerHTML=`
    <div class="card">
      <div class="h">基本設定</div>
      <div class="field">
        <label>每月預設收入</label>
        <input inputmode="text" id="s_income" value="${escapeAttr(String(data.settings.monthlyIncomeDefault))}">
      </div>
      <div class="field">
        <label>每月預設可用金額</label>
        <input inputmode="text" id="s_available" value="${escapeAttr(String(data.settings.monthlyAvailableDefault))}">
      </div>
      <div class="actions">
        <button class="btn primary" id="saveIncome">保存設定</button>
      </div>
    </div>

    <div class="card">
      <div class="row">
        <div class="left"><div class="h">類別管理</div></div>
        <button class="btn small" id="addCat">新增</button>
      </div>
      <div class="list" id="catList"></div>
    </div>

    <div class="card">
      <div class="h">平台 / 付款方式（Tag 模式）</div>
      <div class="sub">按「+」新增；點膠囊可編輯/刪除</div>

      <div class="field">
        <label>平台</label>
        <div class="chipWrap" id="platformChips"></div>
        <div class="actions">
          <button class="btn small" id="addPlatform">＋ 新增平台</button>
        </div>
      </div>

      <div class="field">
        <label>付款方式</label>
        <div class="chipWrap" id="paymentChips"></div>
        <div class="actions">
          <button class="btn small" id="addPayment">＋ 新增付款方式</button>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="h">資料管理</div>
      <div class="actions">
        <button class="btn danger" id="resetAll">清空全部資料</button>
      </div>
    </div>
  `;

  document.getElementById("saveIncome").onclick=()=>{
    const inc = evalAmountExpression(document.getElementById("s_income").value);
    const avail = evalAmountExpression(document.getElementById("s_available").value);
    if (!Number.isFinite(inc) || !Number.isFinite(avail)){ toast("格式錯誤"); return; }
    data.settings.monthlyIncomeDefault=inc;
    data.settings.monthlyAvailableDefault=avail;
    toast("已保存");
  };

  const catList=document.getElementById("catList");
  catList.innerHTML = cats.map(c=>{
    return `
      <div class="item">
        <div class="row">
          <div class="left">
            <div style="display:flex;align-items:center;gap:8px;">
              <div style="font-size:24px;cursor:pointer;" data-editicon="${c.id}">${c.icon||"🏷️"}</div>
              <div class="title">${escapeHtml(c.name)}</div>
              ${!c.enabled?`<span class="bad">已停用</span>`:""}
            </div>
            <div class="meta">預設預算 ${money(c.budget||0)}</div>
          </div>
          <div class="actions">
            <button class="btn small" data-editcat="${c.id}">編輯</button>
          </div>
        </div>
      </div>
    `;
  }).join("");

  // 新增類別
  document.getElementById("addCat").onclick=()=>{
    Modal.form({
      title:"新增類別",
      fields:[ { type:"text", key:"name", label:"名稱" }, { type:"text", key:"budget", label:"預算" } ],
      values:{ name:"", budget:"0" },
      submitText:"新增",
      onSubmit:(v, done)=>{
        const budget=evalAmountExpression(v.budget);
        if(!Number.isFinite(budget)){ toast("預算錯"); return; }
        
        Modal.emojiPicker({
          title: "選擇類別圖示",
          current: "🏷️",
          onPick: (icon) => {
             data.categories.push({ id: uid("cat"), name:v.name, budget, icon: icon || "🏷️", enabled:true });
             toast("已新增");
             done(); renderSettings();
          }
        });
      }
    });
  };

  // 點擊 Icon 更改圖示
  catList.querySelectorAll("[data-editicon]").forEach(el => {
      el.onclick = () => {
          const id = el.dataset.editicon;
          const c = data.categories.find(x => x.id === id);
          if(!c) return;
          Modal.emojiPicker({
             title: `更改「${c.name}」圖示`,
             current: c.icon || "🏷️",
             onPick: (icon) => {
                 c.icon = icon;
                 saveData();
                 renderSettings();
                 toast("已更新圖示");
             }
          });
      };
  });

  // 編輯類別內容
  catList.querySelectorAll("[data-editcat]").forEach(btn=>{
    btn.onclick=()=>{
      const id=btn.dataset.editcat;
      const c=data.categories.find(x=>x.id===id);
      if(!c) return;
      
      // 這裡我們提供更直觀的編輯方式，讓用戶在 Modal 內點擊按鈕來換圖示
      const formHtmlId = uid("editForm");
      
      Modal.open({
         title: "編輯類別",
         bodyHtml: `
            <div id="${formHtmlId}">
                <div class="field" style="flex-direction:row; align-items:center; justify-content:space-between;">
                    <label>點擊圖示更換</label>
                    <button class="btn" id="${formHtmlId}_icon" style="font-size:24px;">${c.icon}</button>
                </div>
                <div class="field">
                    <label>名稱</label>
                    <input id="${formHtmlId}_name" value="${escapeAttr(c.name)}">
                </div>
                <div class="field">
                    <label>預算</label>
                    <input id="${formHtmlId}_budget" value="${escapeAttr(String(c.budget))}">
                </div>
                <div class="switch">
                    <div class="label">啟用</div>
                    <input type="checkbox" id="${formHtmlId}_enabled" ${c.enabled?'checked':''} style="width:22px;height:22px">
                </div>
            </div>
         `,
         footButtons: [
             { text:"取消", onClick: ()=> Modal.close("cancel") },
             { text:"保存", variant:"primary", onClick: () => {
                 const name = document.getElementById(formHtmlId+"_name").value;
                 const budget = evalAmountExpression(document.getElementById(formHtmlId+"_budget").value);
                 const enabled = document.getElementById(formHtmlId+"_enabled").checked;
                 
                 if(!Number.isFinite(budget)){ toast("預算錯"); return; }
                 c.name = name; c.budget = budget; c.enabled = enabled;
                 toast("已保存");
                 Modal.close("ok");
                 renderSettings();
             }}
         ]
      });
      
      // Bind Icon Click inside Modal
      document.getElementById(`${formHtmlId}_icon`).onclick = () => {
          Modal.emojiPicker({
              title: "更換圖示",
              current: c.icon,
              onPick: (newIcon) => {
                  c.icon = newIcon; // Update data ref temporarily
                  document.getElementById(`${formHtmlId}_icon`).textContent = newIcon; // Update UI
              }
          });
      };
    };
  });

  // Render Chips
  renderChips("platformChips", data.platforms, (idx)=> editChip("平台", data.platforms, idx, ()=>renderSettings()));
  renderChips("paymentChips", data.payments, (idx)=> editChip("付款方式", data.payments, idx, ()=>renderSettings()));

  document.getElementById("addPlatform").onclick=()=> addChip("新增平台", data.platforms, ()=>renderSettings(), "例如 UberEats");
  document.getElementById("addPayment").onclick=()=> addChip("新增付款方式", data.payments, ()=>renderSettings(), "例如 八達通 / 信用卡");

  document.getElementById("resetAll").onclick=()=>{
    Modal.confirm({
      title:"清空", msg:"不可還原，確定？", okText:"清空", cancelText:"取消",
      onOk:()=>{
        data = structuredClone(DEFAULT_DATA);
        state.selectedDay=todayISO();
        state.reportMonth=monthKey(todayISO());
        state.editingExpenseId=null;
        toast("已清空");
        setTab("dashboard");
      }
    });
  };
}

// Chip Helpers
function renderChips(containerId, arr, onChipClick){
  const el=document.getElementById(containerId);
  if (!el) return;
  el.innerHTML = (arr||[]).map((t,i)=>`
    <div class="chip" data-i="${i}">
      <span>${escapeHtml(t)}</span>
      <span class="x">⋯</span>
    </div>
  `).join("") || `<div class="hint">尚未設定</div>`;
  el.querySelectorAll(".chip").forEach(ch=>{
    ch.onclick=()=> onChipClick(Number(ch.dataset.i));
  });
}
function addChip(title, arr, onDone, placeholder=""){
  Modal.form({
    title,
    fields:[ { type:"text", key:"text", label:"內容", placeholder } ],
    values:{ text:"" },
    submitText:"新增",
    onSubmit:(v, done)=>{
      const t=(v.text||"").trim();
      if(!t){ toast("請輸入內容"); return; }
      if (!arr.includes(t)) arr.push(t);
      toast("已新增");
      done(); onDone();
    }
  });
}
function editChip(kind, arr, idx, onDone){
  const cur=arr[idx];
  Modal.form({
    title:`編輯${kind}`,
    fields:[ { type:"text", key:"text", label:kind } ],
    values:{ text: cur },
    submitText:"保存",
    dangerText:"刪除",
    onDanger:()=>{
      Modal.confirm({
        title:`刪除${kind}`,
        msg:`確定刪除「${cur}」？`,
        okText:"刪除",
        cancelText:"取消",
        onOk:()=>{
          arr.splice(idx,1);
          toast("已刪除");
          onDone();
        }
      });
    },
    onSubmit:(v, done)=>{
      const t=(v.text||"").trim();
      if(!t){ toast("內容不可為空"); return; }
      arr[idx]=t;
      toast("已保存");
      done(); onDone();
    }
  });
}


/* =========================
   Expense Card + actions
   ========================= */
function expenseCard(e){
  const cat=catById(e.categoryId);
  const flags = [];
  if (e.type==="octopus_topup") flags.push(`<span class="tag">充值</span>`);
  if (e.payment==="八達通" && e.type!=="octopus_topup") flags.push(`<span class="tag">八達通付款</span>`);

  return `
    <div class="item" data-exp="${e.id}">
      <div class="row" style="align-items:flex-start">
        
        <div class="left" style="display:flex; flex-direction:column; gap:6px; flex:1; min-width:0;">
          
          <div style="display:flex; align-items:center; gap:8px; flex-wrap:wrap;">
            <div style="font-size:20px; line-height:1;">${cat?.icon||"🏷️"}</div>
            <div class="title" style="font-size:17px; margin:0;">${escapeHtml(e.title||"(無標題)")}</div>
            ${flags.join("")}
          </div>

          <div style="display:flex; flex-direction:column; gap:3px; font-size:13px; color:var(--text-muted); margin-top:2px;">
            <div>分類：${escapeHtml(cat?.name||"-")}</div>
            <div>購買地方：${escapeHtml(e.platform||"-")}</div>
            <div>付款方式：${escapeHtml(e.payment||"-")}</div>
            ${e.note ? `<div style="margin-top:4px; color:var(--text-main);">備註：${escapeHtml(e.note)}</div>` : ""}
          </div>
          
        </div>

        <div class="amt" style="font-size:18px; flex-shrink:0;">${money(e.amount)}</div>
      </div>

      ${e.receiptImage ? `
        <details class="receipt-toggle">
           <summary>🧾 查看收據圖片</summary>
           <img class="img" src="${e.receiptImage}" alt="receipt" data-zoom="1" style="margin-top:0">
        </details>
      ` : ""}
      
      <div class="actions">
        <button class="btn small" data-editexp="${e.id}">編輯</button>
        <button class="btn small danger" data-delexp="${e.id}">刪除</button>
      </div>
    </div>
  `;
}

function openImageZoom(src){
  Modal.open({
    title: "圖片",
    bodyHtml: `<img src="${src}" style="width:100%;border-radius:12px;">`,
    footButtons: [{ text:"關閉", variant:"primary", onClick: ()=> Modal.close("ok") }]
  });
}

function attachExpenseActions(){
  main.querySelectorAll("[data-delexp]").forEach(btn=>{
    btn.onclick=()=>{
      const id=btn.dataset.delexp;
      Modal.confirm({
        title:"刪除", msg:"確定刪除？", okText:"刪除", cancelText:"取消",
        onOk:()=>{
          data.expenses = data.expenses.filter(e=>e.id!==id);
          toast("已刪除");
          render();
        }
      });
    };
  });
  main.querySelectorAll("[data-editexp]").forEach(btn=>{
    btn.onclick=()=>{
      state.editingExpenseId = btn.dataset.editexp;
      setTab("add");
    };
  });
  main.querySelectorAll('img.img[data-zoom="1"]').forEach(img=>{
    img.onclick=()=>{
      const src = img.getAttribute("src") || "";
      if (!src) return;
      openImageZoom(src);
    };
  });
}

/* =========================
   Export/Import + Settings button
   ========================= */
document.getElementById("btnSettings").onclick=()=>{
  state.tab="settings";
  document.querySelectorAll(".tab").forEach(b=> b.classList.remove("active"));
  renderSettings();
};

document.getElementById("btnExport").onclick=()=>{
  downloadJson(`pocketledger_backup_${todayISO()}.json`, data);
  toast("已匯出");
};

document.getElementById("btnImport").onclick=()=>{
  document.getElementById("importFile").click();
};
document.getElementById("importFile").addEventListener("change", async (e)=>{
  const f=e.target.files?.[0];
  if(!f) return;
  try{
    const text=await f.text();
    const obj=JSON.parse(text);
    if(!obj || typeof obj!=="object") throw new Error("bad");
    localStorage.setItem(LS_KEY, JSON.stringify(obj));
    data = loadData();
    state.selectedDay=todayISO();
    state.reportMonth=monthKey(todayISO());
    state.editingExpenseId=null;
    toast("已匯入");
    setTab("dashboard");
  }catch(err){
    Modal.info("匯入失敗", "格式錯誤");
  }finally{
    e.target.value="";
  }
});

/* =========================
   Nav
   ========================= */
document.querySelectorAll(".tab").forEach(btn=>{
  btn.addEventListener("click", ()=> setTab(btn.dataset.tab));
});

/* =========================
   Boot
   ========================= */
saveData();
setTab("calendar");
</script>
